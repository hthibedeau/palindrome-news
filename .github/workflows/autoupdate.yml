# Keeps the live page current by itself (Hannah, Wed Oct 21, 2026: "create a code that does this").
# Every 10 minutes: tools/autoupdate.py reads ~85 newsrooms and official feeds and writes live/auto.json (newest
# reports on each Breaking story, newer captioned photos, newer wire headlines, live-blog times). The page fetches it
# every 2 minutes. See tools/runbooks/AUTOUPDATE.md.
name: Auto update
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: autoupdate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Scan newsrooms and write live/auto.json
        run: python3 tools/autoupdate.py --page index.html --out live/auto.json
      - name: Commit and push
        run: |
          git config user.name "palindrome-autoupdate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A live
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Auto update: newest reports, photos and wire ($(TZ=America/Toronto date '+%a %-I:%M %p ET'))"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
      - name: Ask GitHub Pages to rebuild
        if: always()
        run: |
          curl -s -o /dev/null -w "pages build request: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
