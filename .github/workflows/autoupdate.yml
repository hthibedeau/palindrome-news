# Keeps the live page current by itself (Hannah, Wed Oct 21, 2026: "create a code that does this").
# Every 10 minutes: tools/autoupdate.py reads ~85 newsrooms and official feeds and writes live/auto.json (newest
# reports on each Breaking story, newer captioned photos, newer wire headlines, live-blog times). The page fetches it
# every 2 minutes. See tools/runbooks/AUTOUPDATE.md.
name: Auto update
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: autoupdate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Scan newsrooms, write live/auto.json, publish (every 10 minutes for about 50 minutes)
        run: |
          # GitHub often starts scheduled runs late, so each run keeps going for ~50 minutes, one pass every 10.
          git config user.name "palindrome-autoupdate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 50*60 ))
          while :; do
            start=$(date +%s)
            git pull -q --rebase -X theirs origin main || true
            python3 tools/autoupdate.py --page index.html --out live/auto.json || echo "pass failed"
            git add -A live
            if ! git diff --cached --quiet; then
              git commit -q -m "Auto update: newest reports, photos and wire ($(TZ=America/Toronto date '+%a %-I:%M %p ET'))"
              for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
              curl -s -o /dev/null -w "pages build request: %{http_code}\n" -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/pages/builds || true
            fi
            next=$(( start + 600 ))
            [ $next -ge $end ] && break
            now=$(date +%s); [ $next -gt $now ] && sleep $(( next - now ))
          done
      - name: Start the next run (GitHub's own schedule often runs late or skips)
        if: always()
        run: |
          curl -s -o /dev/null -w "next run requested: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/autoupdate.yml/dispatches -d '{"ref":"main"}'
