# The 60-second brief in Hannah's own voice, made by the code (tools/brief_voice.py), three times a day plus whenever
# the brief's edition changes. Open-source voice model on GitHub's own machines: no sign-ups, nothing sent elsewhere.
name: Voice brief
on:
  schedule:
    - cron: '50 10,20,23 * * *'   # 6:50 a.m., 4:50 p.m., 7:50 p.m. ET (daylight time)
    - cron: '50 2 * * *'          # 10:50 p.m. ET
  workflow_dispatch:
    inputs:
      force:
        description: 'Record again even if this edition is done'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: brief
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Unlock Hannah's voice recording
        id: has
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          # The recording is kept encrypted in this public repo; only GitHub, with the VOICE_KEY secret, can open it.
          if [ -z "$VOICE_KEY" ] || [ ! -f tools/voice-samples/hannah.m4a.enc ]; then echo "No voice key or recording yet: the page reads the brief with the device voice."; exit 0; fi
          printf '%s\n' "$VOICE_KEY" > "$RUNNER_TEMP/k"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tools/voice-samples/hannah.m4a.enc -out tools/voice-samples/hannah.m4a -pass file:"$RUNNER_TEMP/k"
          rm -f "$RUNNER_TEMP/k"
          echo "yes=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.has.outputs.yes
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/brief.yml
      - uses: actions/cache@v4
        if: steps.has.outputs.yes
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - name: Install the open-source voice model (CPU)
        if: steps.has.outputs.yes
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install chatterbox-tts
      - name: Record the brief
        if: steps.has.outputs.yes
        run: python3 tools/brief_voice.py --auto live/auto.json --out live/brief.json ${{ inputs.force && '--force' || '' }}
      - name: Commit and push
        if: steps.has.outputs.yes
        run: |
          git config user.name "palindrome-autoupdate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A live/brief.json live/audio
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Voice brief ($(TZ=America/Toronto date '+%a %-I:%M %p ET'))"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 7
          done
