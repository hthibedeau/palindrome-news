# The 60-second brief in Hannah's own voice, made by the code (tools/brief_voice.py), three times a day plus whenever
# the brief's edition changes. Open-source voice model on GitHub's own machines: no sign-ups, nothing sent elsewhere.
name: Voice brief
on:
  schedule:
    - cron: '50 10,20,23 * * *'   # 6:50 a.m., 4:50 p.m., 7:50 p.m. ET (daylight time)
    - cron: '50 2 * * *'          # 10:50 p.m. ET
  workflow_dispatch:
    inputs:
      force:
        description: 'Record again even if this edition is done'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: brief
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Is there a recording of Hannah's voice?
        id: has
        run: |
          if ls tools/voice-samples/* 2>/dev/null | grep -Eiq '\.(m4a|mp3|wav|aac|ogg|flac|caf|mp4|mov)$'; then echo "yes=1" >> "$GITHUB_OUTPUT"; else echo "No recording yet in tools/voice-samples/"; fi
      - uses: actions/setup-python@v5
        if: steps.has.outputs.yes
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/brief.yml
      - uses: actions/cache@v4
        if: steps.has.outputs.yes
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - name: Install the open-source voice model (CPU)
        if: steps.has.outputs.yes
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install chatterbox-tts
      - name: Record the brief
        if: steps.has.outputs.yes
        run: python3 tools/brief_voice.py --auto live/auto.json --out live/brief.json ${{ inputs.force && '--force' || '' }}
      - name: Commit and push
        if: steps.has.outputs.yes
        run: |
          git config user.name "palindrome-autoupdate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A live/brief.json live/audio
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Voice brief ($(TZ=America/Toronto date '+%a %-I:%M %p ET'))"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 7
          done
