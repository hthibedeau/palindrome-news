# Checks every outlet link on the page every hour (and that every outlet button opens that outlet's own page) and writes live/links.json; the page hides anything whose link is
# dead (404/410 on two checks in a row). Hannah, Tue Oct 27, 2026: the code runs the site, not Claude.
name: Link check
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linkcheck
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check every link on the page
        run: python3 tools/linkcheck.py --page index.html --out live/links.json
      # Hannah, Wed Oct 28, 2026: "I need the links to always go to the right page." Keeps the tap guard in the page and
      # taps every outlet button and label at phone and desktop width; results in live/taps.json.
      - name: Tap every outlet button and label
        run: |
          pip install -q playwright
          # Wed Nov 11, 2026: Ubuntu's package server (security.ubuntu.com) went unreachable and the whole check failed on
          # installing extra fonts. Try the full install twice (5 min cap each); if Ubuntu is still down, install just the
          # browser (the runner already has what it needs to run it) so the check still runs.
          ok=0
          for i in 1 2; do
            if timeout 300 python3 -m playwright install --with-deps chromium >/dev/null; then ok=1; break; fi
            echo "Full browser install failed (try $i), retrying"; sleep 20
          done
          if [ "$ok" = 0 ]; then
            echo "Ubuntu package server unreachable; installing the browser on its own"
            python3 -m playwright install chromium >/dev/null
          fi
          python3 tools/tap_check.py --install --page index.html
          python3 tools/tap_check.py --page index.html --out live/taps.json
      - name: Commit and push
        run: |
          git config user.name "palindrome-autoupdate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/links.json live/taps.json index.html
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Link check ($(TZ=America/Toronto date '+%a %-I:%M %p ET'))"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 7
          done
