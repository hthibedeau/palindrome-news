<style id="dedupe">
/* No repeats between the two lists (Hannah, Sat Oct 31, 2026: "there are repetitive reports ... I still like connected
   to this story"). Both lists stay. Connected drops anything on the same angle as a newsroom report above it, and two
   connected reports on the same angle become one line with every newsroom that has it. */
#autoBreaking .dd-also { display: block; margin-top: 4px; font-size: 12.5px; opacity: .85; }
#autoBreaking .dd-also a { color: #FFFFFF; font-weight: 600; text-decoration: none; position: relative; z-index: 2; }
#autoBreaking .dd-gone { display: none !important; }
/* The newsroom's name stands apart from the headline (Hannah, Sat Oct 31, 2026: "when it has the source at the end ...
   it needs to stand out differently than what the title is. Right now, it all blends together" ... "I like it all in one
   line, but make it stand out"): on the same line, at the end, as a small blush-pink tag in bold capitals, in both lists. */
#autoBreaking .ab-story .rel-box li .o, #autoBreaking .ab-story .ab-reps li .o, #autoBreaking .dd-also a {
  display: inline; margin: 0 0 0 4px; padding: 0; background: none; border: 0; white-space: normal;
  font-size: 11.5px !important; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; line-height: 1.4;
  color: #FF9FBD !important; opacity: 1 !important; font-variant: normal; text-decoration: none; }
#autoBreaking .ab-story .rel-box li .o::before, #autoBreaking .ab-story .ab-reps li .o::before { content: "\2014\00a0"; font-weight: 400; color: rgba(255, 255, 255, .55); }
#autoBreaking .ab-story .rel-box li .o, #autoBreaking .ab-story .ab-reps li .o { white-space: nowrap !important; }  /* the name never splits */
#autoBreaking .dd-also { display: inline; margin-left: 2px; font-size: 11px; color: #F2B8C6; }
#autoBreaking .dd-also a { margin-left: 4px; }
#autoBreaking .ab-story .rel-box li > a, #autoBreaking .ab-story .ab-reps li > a { font-size: 16px; line-height: 1.35; }
</style>
<script id="dedupe-js">
(function () {
  const root = document.getElementById('autoBreaking'); if (!root) return;
  const GENERIC = new Set(('canada canadian canadians carney prime minister says said could would will with from that this they their about after over into than more ' +
    'what here know year years week today new news live updates update report reports amid under ahead also just been have has were being ' +
    'european union summit montreal leaders leader talks deal deals ottawa trump u.s. united states american americans midterms').split(' '));
  const toks = (t) => new Set((String(t).toLowerCase().match(/[a-zà-ÿ][a-zà-ÿ'’-]{3,}/g) || []).filter((w) => !GENERIC.has(w.replace(/['’]s$/, ''))).map((w) => w.replace(/['’]s$/, '').slice(0, 6)));
  const shared = (a, b) => { let n = 0; a.forEach((w) => { if (b.has(w)) n++; }); return n; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let busy = false;
  function run() {
    if (busy) return; busy = true;
    try {
      root.querySelectorAll('.ab-story').forEach((art) => {
        const rel = art.querySelector(':scope > .rel-box'), reps = art.querySelector(':scope > .ab-reps');
        if (!rel || rel.dataset.dd) return;
        const head = (li) => (li.querySelector('a') || {}).textContent || '';
        const mine = [...(reps ? reps.querySelectorAll('ol > li') : [])].map((li) => toks(head(li))).concat([toks((art.querySelector(':scope > h2') || {}).textContent || '')]);
        // words most of the story's reports share name the event itself; an angle is what is left
        const freq = {}; mine.forEach((s) => s.forEach((w) => { freq[w] = (freq[w] || 0) + 1; }));
        const common = new Set(Object.keys(freq).filter((w) => mine.length >= 3 && freq[w] / mine.length > 0.6));
        const strip = (s) => new Set([...s].filter((w) => !common.has(w)));
        const mineK = mine.map(strip);
        const kept = [];
        [...rel.querySelectorAll('ol > li')].forEach((li) => {
          const k = strip(toks(head(li)));
          // the same angle as a newsroom report above: already there
          if (mineK.some((m) => shared(k, m) >= 2)) { li.classList.add('dd-gone'); return; }
          // the same angle as a connected report already kept: one line, every newsroom on it
          const twin = kept.find((x) => shared(k, x.k) >= 2);
          if (twin) {
            li.classList.add('dd-gone');
            const a = li.querySelector('a'), o = (li.querySelector('.o') || {}).textContent || '';
            if (a) {
              let also = twin.li.querySelector('.dd-also');
              if (!also) { also = document.createElement('span'); also.className = 'dd-also'; also.innerHTML = 'Also: '; twin.li.appendChild(also); }
              else also.insertAdjacentHTML('beforeend', ' · ');
              also.insertAdjacentHTML('beforeend', '<a href="' + esc(a.href) + '" target="_blank" rel="noopener" title="' + esc(a.textContent) + '">' + esc(o.replace(/\s*↗\s*$/, '').trim()) + ' &#8599;</a>');
            }
            twin.k.forEach && k.forEach((w) => twin.k.add(w));
            return;
          }
          kept.push({ li, k });
        });
        rel.dataset.dd = '1';
        // nothing different left: the box goes; otherwise the Show all button counts what is left
        if (!kept.length) { rel.classList.add('dd-gone'); return; }
        const b = rel.querySelector('.cr-more');
        rel.querySelectorAll('ol > li.dd-gone').forEach((li) => li.remove());
        if (b) {
          const n = kept.length, nb = b.cloneNode(false);  // a fresh button that counts what is left
          rel.classList.remove('cr-open');
          if (n <= 3) { b.remove(); rel.classList.remove('cr-fold'); }
          else {
            const closed = 'Show all ' + n + ' ▾', opened = 'Show fewer ▴'; nb.textContent = closed;
            nb.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); const on = rel.classList.toggle('cr-open'); nb.textContent = on ? opened : closed; });
            b.replaceWith(nb);
          }
        }
      });
    } catch (e) { console.warn('dedupe', e); }
    setTimeout(() => { busy = false; }, 60);
  }
  setTimeout(run, 2500); setTimeout(run, 6000);
  new MutationObserver(() => { if (!busy) { clearTimeout(run.t); run.t = setTimeout(run, 300); } }).observe(root, { childList: true, subtree: true });
})();
</script>
<style id="dedupe-head">
/* the list heading and its Show all button fit side by side on a phone */
#autoBreaking .ab-story .cr-fold > summary { padding-right: 96px !important; font-size: 12px !important; letter-spacing: .03em !important; }
#autoBreaking .ab-story .cr-fold > .cr-more { font-size: 12px !important; padding: 0 9px !important; min-height: 30px !important; }
</style>

<script id="dedupe-fit">
(function () {
  // The newsroom's name on the same line as the end of the headline (Hannah, Sat Oct 31, 2026: "try to always fit the
  // newsroom names on the same line. So if you have to make it smaller, the font, it's okay"): if it would drop to a
  // line of its own, its type gets smaller step by step (down to 9.5px), then a shorter form of the name is tried the
  // same way; if nothing fits, the short name stays readable at full size.
  const root = document.getElementById('autoBreaking'); if (!root) return;
  const SHORT = [[/^Canada's National Observer/i, 'National Observer'], [/\s*·\s*The Canadian Press story/i, ' · CP'], [/\s*·\s*Associated Press story/i, ' · AP'],
    [/\s*·\s*Reuters story/i, ' · Reuters'], [/^The Canadian Press/i, 'CP'], [/^Prime Minister of Canada/i, 'PM of Canada'], [/^Government of Canada/i, 'Gov. of Canada'],
    [/^The New York Times/i, 'NYT'], [/^The Washington Post/i, 'Wash. Post'], [/^The Wall Street Journal/i, 'WSJ'], [/^CityNews /i, 'CityNews '], [/ News$/i, '']];
  function sameLine(o) {
    const prev = o.previousElementSibling && o.previousElementSibling.tagName === 'A' ? o.previousElementSibling : o.parentElement.querySelector('a');
    if (!prev) return true;
    const r = prev.getClientRects(); if (!r.length) return true;
    const last = r[r.length - 1], me = o.getClientRects(); if (!me.length) return true;
    return Math.abs(me[0].top - last.top) < 6 && me[me.length - 1].right <= o.closest('li').getBoundingClientRect().right + 1;
  }
  let busy = false;
  function fit() {
    if (busy) return; busy = true;
    try {
      root.querySelectorAll('.ab-story .rel-box li .o, .ab-story .ab-reps li .o').forEach((o) => {
        if (o.offsetParent === null) return;
        if (!o.dataset.full) o.dataset.full = o.textContent;
        const a = o.parentElement.querySelector('a');
        if (a) a.style.removeProperty('font-size');
        let short = o.dataset.full; SHORT.forEach(([rx, rep]) => { short = short.replace(rx, rep); });
        // shortest: a local station without its city (CityNews Winnipeg -> CityNews), the wire credit as CP/AP
        const shortest = short.replace(/^(CityNews|CTV News|CTV|Global News|Global|CBC News|CBC|CP24|Postmedia)\s+(?!·)[A-Z][\w.'-]+(?:\s+[A-Z][\w.'-]+)?/, '$1');
        const tries = [...new Set([o.dataset.full, short, shortest])];
        let done = false;
        for (const t of tries) {
          o.textContent = t;
          for (let px = 11.5; px >= 9.5 && !done; px -= 0.5) { o.style.setProperty('font-size', px + 'px', 'important'); done = sameLine(o); }
          if (done) break;
        }
        // still no room: the headline in that row gets a little smaller too (down to 14px), with the short name at 10px
        if (!done && a) {
          o.textContent = tries[tries.length - 1]; o.style.setProperty('font-size', '10px', 'important');
          for (let hp = 15.5; hp >= 14 && !done; hp -= 0.5) { a.style.setProperty('font-size', hp + 'px', 'important'); done = sameLine(o); }
          if (!done) a.style.removeProperty('font-size');
        }
        // nothing fits beside the headline: the short name at full size, readable, on the next line
        if (!done) { o.textContent = tries[tries.length - 1]; o.style.removeProperty('font-size'); }
        if (o.textContent !== o.dataset.full) o.title = o.dataset.full.replace(/\s*↗\s*$/, '');
      });
    } catch (e) { console.warn('fit', e); }
    setTimeout(() => { busy = false; }, 60);
  }
  setTimeout(fit, 3000); setTimeout(fit, 7000);
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fit, 250); });
  root.addEventListener('click', (e) => { if (e.target.closest('.cr-more')) setTimeout(fit, 50); });
  new MutationObserver(() => { if (!busy) { clearTimeout(fit.t); fit.t = setTimeout(fit, 400); } }).observe(root, { childList: true, subtree: true });
})();
</script>
