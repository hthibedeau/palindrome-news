    const brief = document.createElement('a'); brief.className = 'dz-brief'; brief.href = '#newsletter'; brief.textContent = 'Get the Daily Brief'; document.body.appendChild(brief);
    const top = document.createElement('button'); top.type = 'button'; top.className = 'dz-top'; top.setAttribute('aria-label', 'Back to top');
    top.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    top.addEventListener('click', () => { scrollTo({ top: 0, behavior: 'smooth' }); });
    document.body.appendChild(top);
    const nl = $('#newsletter');
    const onScroll = () => { const y = scrollY; top.classList.toggle('show', y > 1200); const nearNl = nl && nl.getBoundingClientRect().top < innerHeight; brief.classList.toggle('hide', y < 500 || nearNl); };
    addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }

  /* 4 + 11. long sections fold closed with "Show all"; nothing leaves the page */
  const FOLD = { developed: [520, 420], video: [560, 640], ahead: [480, 460], dayso: [560, 520], canus: [900, 760], 'sec-us': [760, 640], mostread: [560, 560],
    reading: [440, 440], ontherecord: [560, 520], editorials: [600, 560], thinktanks: [700, 600], board: [520, 480], corrections: [420, 400], godeeper: [460, 440],
    liveCoverage: [760, 700], 'sec-canada': [1250, 1100], smaller: [600, 560] };
  function sectionName(sec) { const h = $('h2, h3', sec); return h ? h.textContent.replace(/\s+/g, ' ').trim().replace(/\d+ stories.*$/, '').slice(0, 40) : 'section'; }
  function toggleFold(sec, force) {
    const open = force !== undefined ? force : !sec.classList.contains('dz-open');
    sec.classList.toggle('dz-open', open);
    const b = $(':scope > .dz-showall', sec); if (b) { b.setAttribute('aria-expanded', open); b.firstChild.textContent = open ? 'Show less ' : 'Show all of ' + sectionName(sec) + ' '; b.lastChild.style.transform = open ? 'rotate(180deg)' : ''; }
    store.set('dz-fold-' + (sec.id || sec.dataset.dzKey), open ? '1' : '0');
  }
  function folds() {
    const day = $$('main section').find((s) => !s.id && /^The day so far/.test(($('h2', s) || {}).textContent || '')); if (day) day.dataset.dzKey = 'dayso';
    Object.entries(FOLD).forEach(([id, [dh, mh]]) => {
      const sec = id === 'dayso' ? day : document.getElementById(id); if (!sec || sec.hidden || sec.offsetParent === null) return;
      const lim = mob.matches ? mh : dh; sec.style.setProperty('--dz-h', lim + 'px');
      if (sec.classList.contains('dz-fold')) { if (!$(':scope > .dz-showall', sec)) addBtn(sec); return; }
      if (sec.scrollHeight < lim * 1.25) return;
      sec.classList.add('dz-fold'); addBtn(sec);
      if (store.get('dz-fold-' + (sec.id || sec.dataset.dzKey)) === '1') toggleFold(sec, true);
    });
  }
  function addBtn(sec) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'dz-showall'; b.setAttribute('aria-expanded', 'false');
    b.innerHTML = 'Show all of ' + sectionName(sec) + ' <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    b.firstChild.textContent = 'Show all of ' + sectionName(sec) + ' ';
    b.addEventListener('click', () => { const was = sec.classList.contains('dz-open'); toggleFold(sec); if (was) sec.scrollIntoView({ block: 'start' }); });
    sec.appendChild(b); if (sec.classList.contains('dz-open')) toggleFold(sec, true);
  }

  /* 2. stale material ages out by itself */
  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  function parseDay(t) {
    t = (t || '').trim().toLowerCase(); const now = new Date();
    if (/^(today|now|just now|new|live|\d+ (min|hr|hour)s? ago)/.test(t)) return now;
    if (/^yesterday/.test(t)) return new Date(now - 864e5);
    const m = t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/); if (!m) return null;
    let d = new Date(now.getFullYear(), MON[m[1]], +m[2], 23, 59); if (d - now > 30 * 864e5) d.setFullYear(d.getFullYear() - 1); return d;
  }
  function staleWatch() {
    const sec = $('#video'), list = $('#vids'); if (!sec || !list) return;
    let n = 0;
    $$('.vid', list).forEach((v) => { const w = $('.when', v); const d = w && parseDay(w.textContent); const old = !!(d && Date.now() - d > 3 * 864e5); v.classList.toggle('dz-old', old); if (old) n++; });
    let b = $('.dz-earlier', sec);
    if (!n) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('button'); b.type = 'button'; b.className = 'dz-earlier'; b.addEventListener('click', () => { const o = sec.classList.toggle('dz-old-open'); b.textContent = o ? 'Hide earlier clips' : b.dataset.label; }); list.after(b); }
    b.dataset.label = 'Show ' + n + ' earlier clip' + (n > 1 ? 's' : '') + ' (more than 3 days old)';
    if (!sec.classList.contains('dz-old-open') && b.textContent !== b.dataset.label) b.textContent = b.dataset.label;
  }
  function staleTop() {
    // a hand-written Breaking story with nothing new for 12 hours leaves the top (the Breaking template's 12-hour rule)
    $$('section.breaking[data-lastdev], section.breaking[data-since]').forEach((s) => {
      if (s.id === 'autoBreaking') return;
      const t = Date.parse(s.dataset.lastdev || s.dataset.since); if (!t) return;
      if (Date.now() - t > 12 * 36e5) s.classList.add('dz-hide'); else s.classList.remove('dz-hide');
    });
    // "Breaking" in the newest hour gets the red rule; otherwise the accent
    const ab = $('#autoBreaking');
    if (ab) {
      let any = false;
      $$('.cr-tags > :first-child', ab).forEach((tag) => { const u = /breaking/i.test(tag.textContent); tag.classList.toggle('dz-urgent-tag', u); any = any || u; });
      ab.classList.toggle('dz-urgent', any);
    }
    // labels that name a past morning ("Today's ranking (Monday morning)") follow the real check time
    const note = $$('#mostread p.fine').find((p) => /\((Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday) (morning|afternoon|evening)\)/.test(p.textContent));
    if (note && window.__dzAuto && window.__dzAuto.mostread) note.innerHTML = note.innerHTML.replace(/\((Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday) (morning|afternoon|evening)\)/, '(checked ' + (window.__dzAuto.checkedLabel || 'today') + ')');
  }

  /* 2b. cards whose own time is more than two days old tuck under "Show older stories" (the page never shows a week-old story as news) */
  const WD = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  function ageDays(txt) {
    const now = new Date();
    const m = txt.match(/(Sun|Mon|Tue|Wed|Thu|Fri|Sat)[a-z]*\.?,? (\d{1,2})(?::(\d{2}))? ?([ap])\.m\./);
    if (m) {
      let d = (now.getDay() - WD[m[1].toLowerCase()] + 7) % 7;
      if (d === 0) { let h = +m[2] % 12 + (m[4] === 'p' ? 12 : 0); if (h * 60 + (+m[3] || 0) > now.getHours() * 60 + now.getMinutes() + 30) d = 7; }
      return d;
    }
    const p = parseDay((txt.match(/(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2}(?!\d)/) || [''])[0]);
    return p ? Math.floor((now - p) / 864e5) + 1 : null;
  }
  const AGED = ['#usLead', '#usList', '#reads', '#record', '#mrList', '#editorialList'];
  function agedCards() {
    AGED.forEach((sel) => {
      const box = $(sel); if (!box) return;
      const kids = [...box.children].filter((k) => !k.classList.contains('dz-aged-btn'));
      let n = 0;
      kids.forEach((k) => { const a = ageDays(k.textContent); const old = a !== null && a >= 2; k.classList.toggle('dz-aged', old); if (old) n++; });
      let b = box.nextElementSibling && box.nextElementSibling.classList.contains('dz-aged-btn') ? box.nextElementSibling : null;
      if (!n) { if (b) b.remove(); box.classList.remove('dz-aged-open'); return; }
      const label = (n === kids.length ? 'Nothing new here in the last two days. ' : '') + 'Show ' + n + ' older stor' + (n > 1 ? 'ies' : 'y') + ' (more than 2 days old)';
      if (!b) { b = document.createElement('button'); b.type = 'button'; b.className = 'dz-earlier dz-aged-btn'; b.addEventListener('click', () => { const o = box.classList.toggle('dz-aged-open'); b.textContent = o ? 'Hide older stories' : b.dataset.label; }); box.after(b); }
      b.dataset.label = label; if (!box.classList.contains('dz-aged-open') && b.textContent !== label) b.textContent = label;
    });
  }

  /* 3. sponsor slots that aren't sold yet stay built but don't show placeholder text */
  const PH = /\[(SPONSOR NAME|PRESENTING SPONSOR|Sponsor message goes here|Sponsored editorial headline|YOUR PRICE)\]/;
  function sponsors() {
    $$('.sponsor-strip').forEach((s) => { if (PH.test(s.textContent)) s.classList.add('dz-hide'); });
    $$('aside.paid').forEach((a) => {
      const items = $$('.item', a).filter((i) => PH.test(i.textContent)); if (!items.length) return;
      items.forEach((i) => i.classList.add('dz-hide'));
      if (!$('.dz-open-slot', a)) { const p = document.createElement('div'); p.className = 'dz-open-slot'; p.innerHTML = 'Space for a labelled paid editorial. <a href="#sponsors">Talk to us about it &rarr;</a>'; items[0].before(p); }
    });
    const sp = $('#sponsors');
    if (sp) {
      const slots = $$('.slot', sp).filter((s) => PH.test(s.textContent)); slots.forEach((s) => s.classList.add('dz-hide'));
      if (slots.length && !$('.dz-open-slot', sp)) { const p = document.createElement('div'); p.className = 'dz-open-slot'; p.innerHTML = 'Presenting and supporting sponsorships are open. Sponsors never choose or rank the news.'; (slots[0].closest('.main') || slots[0].parentNode).prepend(p); }
    }
    $$('dd, li').forEach((el) => { if (/\[YOUR PRICE\]/.test(el.textContent)) el.innerHTML = el.innerHTML.replace(/\[YOUR PRICE\]/g, 'price on request'); });
  }

  /* 1. pictures that fail become a clean tile with the outlet's name */
  const HOSTS = { 'cbc.ca': 'CBC News', 'ctvnews.ca': 'CTV News', 'globalnews.ca': 'Global News', 'theglobeandmail.com': 'The Globe and Mail', 'thestar.com': 'Toronto Star',
    'nationalpost.com': 'National Post', 'citynews.ca': 'CityNews', 'cp24.com': 'CP24', 'aljazeera.com': 'Al Jazeera', 'cbsnews.com': 'CBS News', 'nbcnews.com': 'NBC News',
    'abcnews.go.com': 'ABC News', 'pbs.org': 'PBS NewsHour', 'cnn.com': 'CNN', 'foxnews.com': 'Fox News', 'apnews.com': 'AP', 'reuters.com': 'Reuters', 'bbc.com': 'BBC News',
    'theguardian.com': 'The Guardian', 'politico.com': 'Politico', 'thetyee.ca': 'The Tyee', 'aptnnews.ca': 'APTN News', 'nunatsiaq.com': 'Nunatsiaq News', 'cabinradio.ca': 'Cabin Radio' };
  function outletFor(el) {
    const c = el.closest('[data-credit]'); if (c && c.dataset.credit) return c.dataset.credit;
    for (const host of [el.closest('a, .ph, .bart, .art'), el.closest('article, li, .vid, .card, .clk, .item')].filter(Boolean)) {
      const cr = $('.credit, .cr-credit, .src b, .src, .out, .outlet, .fm-src, .o', host);
      if (cr && cr.textContent.trim()) return cr.textContent.replace(/·.*$/, '').replace(/^New/, '').replace(/↗/g, '').trim().slice(0, 40);
    }
    const art = el.closest('article, li, .card'); if (art) { const fm = $$('.fm + *, .fs-src, div:last-child', art).map((x) => x.textContent.trim()).find((t) => t && t.length < 60 && !/of 6|outlets|\d:\d/.test(t)); if (fm) return fm.split('·')[0].trim(); }
    const a = el.closest('a[href^="http"]') || $('a[href^="http"]', el.closest('article, li') || el);
    if (a) { try { const h = new URL(a.href).hostname.replace(/^www\./, ''); const k = Object.keys(HOSTS).find((d) => h === d || h.endsWith('.' + d)); return k ? HOSTS[k] : h; } catch (e) {} }
    return 'Palindrome News';
  }
  function tile(box, el) {
    if (!box || $(':scope > .dz-tile', box)) return;
    const t = document.createElement('span'); t.className = 'dz-tile'; t.setAttribute('aria-hidden', 'true');
    t.innerHTML = (box.offsetWidth >= 160 ? '<small>Photo unavailable</small>' : '') + outletFor(el || box).replace(/[<>&]/g, '');
    box.classList.add('dz-tile-host'); if (box.offsetHeight < 60) box.classList.add('dz-sized'); box.appendChild(t);
  }
  function onImgFail(img) {
    if (img.closest('.dz-tile-host') && $(':scope > .dz-tile', img.closest('.dz-tile-host'))) return;
    const box = img.parentElement; img.style.visibility = 'hidden'; tile(box, img);
  }
  // a picture that turns up late after all replaces its tile
  document.addEventListener('load', (e) => { const t = e.target; if (!t || t.tagName !== 'IMG' || !t.naturalWidth) return; const host = t.closest('.dz-tile-host'); if (host) { const tl = $(':scope > .dz-tile', host); if (tl) tl.remove(); host.classList.remove('dz-tile-host', 'dz-sized'); t.style.visibility = ''; } }, true);
  const seen = new WeakMap();
  function slowImages() {
    // still loading 8 seconds after it came into view: show the tile meanwhile
    $$('img').forEach((img) => {
      if (img.complete || !img.offsetParent) return;
      const r = img.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight * 1.5) return;
      const t0 = seen.get(img); if (!t0) { seen.set(img, Date.now()); return; }
      if (Date.now() - t0 > 8000) onImgFail(img);
    });
  }
  addEventListener('scroll', () => { clearTimeout(slowImages.t); slowImages.t = setTimeout(slowImages, 250); }, { passive: true });
  setInterval(slowImages, 3000);
  document.addEventListener('error', (e) => { const t = e.target; if (t && t.tagName === 'IMG') setTimeout(() => { if (!t.naturalWidth) onImgFail(t); }, 1500); }, true);
  function imageSweep() {
    $$('img').forEach((img) => { if (img.complete && img.naturalWidth === 0 && img.getAttribute('src') && img.offsetParent && img.loading !== 'lazy') onImgFail(img); });
    $$('img').forEach((img) => { if (img.complete && img.naturalWidth === 0 && img.getAttribute('src') && img.offsetParent && img.getBoundingClientRect().top < innerHeight * 2) onImgFail(img); });
    // a photo box with nothing in it at all (no picture, no drawing): give it the tile
    $$('[data-photo], .art, .bart, .ph').forEach((b) => {
      if (!b.offsetParent || b.offsetHeight < 40 || $(':scope > .dz-tile', b)) return;
      if (b.getBoundingClientRect().top > innerHeight * 2) return;
      const ok = $$('img', b).some((i) => i.naturalWidth > 0) || $('svg, canvas, video, iframe', b) || getComputedStyle(b).backgroundImage.includes('url(');
      if (!ok && !$$('img', b).some((i) => !i.complete)) tile(b, b);
    });
  }
  /* quick win: lazy-load everything below the first screen */
  function lazy() { $$('img:not([loading])').forEach((i) => { if (i.getBoundingClientRect().top > innerHeight * 1.5) { i.loading = 'lazy'; i.decoding = 'async'; } }); }

  /* 5. the lead's "Connected to this story" fills the empty column under the second story on wide screens */
  function leadFill() {
    const ab = $('#autoBreaking'); if (!ab || ab.offsetParent === null) return;
    const stories = $$(':scope > .ab-story', ab); if (stories.length < 2) return;
    const [first, second] = stories;
    const side = Math.abs(second.getBoundingClientRect().top - first.getBoundingClientRect().top) < 40 && innerWidth >= 900;
    const moved = $(':scope > .rel-box.dz-moved', second);
    if (side && !moved) { const r = $(':scope > .rel-box', first); if (r) { r.classList.add('dz-moved'); r.style.setProperty('display', 'block', 'important'); second.appendChild(r); } }
    else if (!side && moved) { const anchor = $(':scope > .ab-vids, :scope > .ab-reps', first); moved.classList.remove('dz-moved'); moved.style.removeProperty('display'); anchor ? first.insertBefore(moved, anchor) : first.appendChild(moved); }
  }

  /* 14. the source meter on every lead story, explained once */
  function meterHTML(n) { let s = ''; for (let i = 0; i < 6; i++) s += '<i' + (i < n ? ' class="on"' : '') + '></i>'; return '<span class="meter ' + (n >= 6 ? 'ok' : 'dev') + '" title="' + n + ' of 6 independent outlets"><span class="segs" aria-hidden="true">' + s + '</span>' + (n >= 6 ? n + ' outlets <span class="st">Verified</span>' : n + ' of 6 <span class="st">Developing</span>') + '</span>'; }
  function meters() {
    $$('#autoBreaking .cr-byline').forEach((b) => {
      if ($('.meter', b)) return;
      const w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT); let n;
      while ((n = w.nextNode())) { const m = n.textContent.match(/(\d+) independent reports?/); if (m) { const sp = document.createElement('span'); sp.innerHTML = meterHTML(+m[1]); n.textContent = n.textContent.replace(m[0], ''); n.after(sp.firstChild); break; } }
    });
    if ($('.dz-legend')) return;
    const first = $$('.meter').find((m) => m.offsetParent); if (!first) return;
    const host = first.closest('section, .front'); if (!host) return;
    const lg = document.createElement('p'); lg.className = 'dz-legend';
    lg.innerHTML = meterHTML(6) + '<span>How many independent newsrooms have confirmed a story. At six, it is verified and gets our full summary; below six, it is Developing.</span>';
    const head = $('.band-head, h2, h3', host); if (head) head.after(lg); else host.prepend(lg);
  }

  /* keep it all applied as the page refreshes itself every 2 minutes */
  function run() { try { badge(); sponsors(); staleTop(); staleWatch(); agedCards(); leadFill(); meters(); navs(); folds(); imageSweep(); lazy(); } catch (e) { console.warn('design layer', e); } }
  const origFetch = window.fetch;
  if (origFetch) window.fetch = function (u) { const p = origFetch.apply(this, arguments); try { if (String(u).includes('auto.json')) p.then((r) => r.clone().json()).then((j) => { window.__dzAuto = j; setTimeout(run, 400); }).catch(() => {}); } catch (e) {} return p; };
  let timer = null; const later = () => { clearTimeout(timer); timer = setTimeout(run, 300); };
  const start = () => {
    phoneHeader(); run();
    new MutationObserver((ms) => { if (ms.some((m) => !(m.target.closest && (m.target.closest('.dz-menu, .dz-drawer, .dz-tabs, #clocks, .clk, .clock, #clock'))))) later(); })
      .observe(document.querySelector('main') || document.body, { childList: true, subtree: true });
    addEventListener('resize', later); mob.addEventListener ? mob.addEventListener('change', () => { $$('.dz-fold').forEach((s) => { const k = s.id || s.dataset.dzKey; const v = FOLD[k]; if (v) s.style.setProperty('--dz-h', (mob.matches ? v[1] : v[0]) + 'px'); }); later(); }) : 0;
    setInterval(run, 60000);
    addEventListener('load', () => setTimeout(run, 800));
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
