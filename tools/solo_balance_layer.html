<!-- solo-balance:start -->
<script id="solo-balance">
// NO HALF-EMPTY PAGE WHEN ONE STORY STANDS ALONE (Hannah, Mon Nov 9, 2026, a photo of her iPad: "Half the page is
// blank. We've gone through this multiple times. Make it look really good."). On a big news day the lead story runs
// full width: photo, headline and summary on the left, the Canadian angle and Connected to this story in a column on
// the right. That right column ended halfway down, beside the long newsroom list on the left, so the right half of the
// screen was empty colour. Now, on a wide screen (iPad, laptop), the two columns are measured after every update:
//   1. "The latest from every newsroom" moves into the right column (under the Canadian angle, above Connected) when
//      that brings the two bottoms closer together;
//   2. if the right column is still clearly shorter, the list opens by itself (Show all) — but only if that evens
//      things out, and never against a reader's own tap.
// It goes back where it was on a phone, or when the story no longer stands alone. Nothing is removed.
(function () {
  const root = document.getElementById('autoBreaking'); if (!root) return;
  const GAP = 16, SLACK = 120;
  const wide = () => window.matchMedia('(min-width: 960px)').matches;
  const box = (e) => { if (!e) return null; const cs = getComputedStyle(e); if (cs.display === 'none' || e.hidden) return null; return e.getBoundingClientRect(); };
  let busy = false, t = 0;
  function cols(art, side) {
    const top = art.getBoundingClientRect().top; let left = 0;
    [...art.children].forEach((e) => { if (e === side) return; const r = box(e); if (r && r.height) left = Math.max(left, r.bottom - top); });
    const s = box(side); return { left, right: s ? s.bottom - top : 0 };
  }
  function undo() {
    root.querySelectorAll('.ab-side > .sb-moved').forEach((x) => { const a = x.closest('.ab-story'); x.classList.remove('sb-moved'); if (a) a.appendChild(x); });
  }
  function run() {
    if (busy) return; busy = true;
    try {
      const art = root.querySelector(':scope > .ab-story'), side = art && art.querySelector(':scope > .ab-side');
      if (!root.classList.contains('solo') || !wide() || !side || root.hidden) { undo(); return; }
      const reps = art.querySelector('.ab-reps'), rel = art.querySelector('.rel-box');
      // wait until the other layers have folded the list and de-duplicated Connected
      if ((!reps || !reps.classList.contains('cr-fold') || (rel && !rel.dataset.dd)) && (run.tries = (run.tries || 0) + 1) < 10) { clearTimeout(t); t = setTimeout(run, 400); return; }
      run.tries = 0; if (!reps) return;
      let c = cols(art, side);
      // 1. move the newsroom list across when it evens the columns
      if (reps.parentNode !== side && c.left - c.right > SLACK) {
        const h = reps.getBoundingClientRect().height + GAP;
        if (Math.abs((c.left - h) - (c.right + h)) < c.left - c.right) {
          reps.classList.add('sb-moved');
          if (rel && rel.parentNode === side) rel.before(reps); else side.appendChild(reps);
          c = cols(art, side);
        }
      } else if (reps.parentNode === side && c.right - c.left > SLACK && reps.classList.contains('sb-moved')) {
        // the right column grew past the left (a long Canadian angle, projections): the list goes back
        reps.classList.remove('sb-moved'); art.appendChild(reps); c = cols(art, side);
      }
      // 2. still a gap on the right: open the list if that evens things out
      if (reps.parentNode === side && c.left - c.right > SLACK && !reps.classList.contains('cr-open') && !reps.dataset.user) {
        const b = reps.querySelector(':scope > .cr-more');
        if (b) {
          const before = c.left - c.right; b.click(); const n = cols(art, side);
          if (Math.abs(n.left - n.right) >= before) b.click(); else reps.dataset.auto = '1';
        }
      }
    } catch (e) { console.warn('solo-balance', e); }
    finally { setTimeout(() => { busy = false; }, 80); }
  }
  const later = (ms) => { clearTimeout(t); t = setTimeout(run, ms); };
  new MutationObserver(() => { if (!busy) later(450); }).observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden'] });
  window.addEventListener('resize', () => later(300));
  window.addEventListener('load', () => later(300));
  later(1200); setTimeout(run, 4500);
  window.PAL_soloBalance = run;
})();
</script>
<style id="solo-balance-css">
@media (min-width: 960px) {
  /* the newsroom list in the right column keeps its own look; its "Show all" stays in its heading */
  #autoBreaking.solo .ab-story > .ab-side > .ab-reps { border-top: 1px solid rgba(255,255,255,.16) !important; padding-top: 14px !important; }
  #autoBreaking.solo .ab-story > .ab-side > .ab-reps li { font-size: 15.5px; }
}
</style>
<!-- solo-balance:end -->
